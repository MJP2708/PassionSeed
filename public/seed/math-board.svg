<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <rect width="1200" height="800" fill="#2f4a3a"/>
  <rect x="20" y="20" width="1160" height="760" fill="none" stroke="#8a6a44" stroke-width="18"/>
  <g fill="#f4f1e8" font-family="Itim, 'Comic Sans MS', cursive" font-size="44">
    <text x="80" y="110" font-size="54">ลำดับเรขาคณิต (Geometric sequence)</text>
    <text x="80" y="190">a&#8345; = a&#8321; · r&#8319;&#8315;&#185;      r = อัตราส่วนร่วม</text>
    <text x="80" y="270">ตัวอย่าง  3, 6, 12, 24, ...   →  r = 2</text>
    <text x="80" y="350">a&#8326; = 3 · 2&#8309; = 96</text>
    <text x="80" y="460" font-size="54">อนุกรมเรขาคณิต</text>
    <text x="80" y="540">S&#8345; = a&#8321;(1 − r&#8319;) / (1 − r) ,  r ≠ 1</text>
    <text x="80" y="620">ถ้า |r| &lt; 1 :  S&#8734; = a&#8321; / (1 − r)</text>
    <text x="80" y="720" fill="#ffe066">★ ออกสอบ! ระวังเครื่องหมายเมื่อ r ติดลบ</text>
  </g>
</svg>
